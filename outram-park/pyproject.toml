[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "outram-park"
version = "0.1.0"
description = "Python bindings exposing the outram-park-backend reactor simulation API."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Physics",
]

[tool.maturin]
features = ["python", "all-backends"]
no-default-features = true
# Built without the default `gui` feature: the Python wheel only needs the
# `python` feature (pyo3, cdylib), not the desktop GUI's windowing deps.
# `all-backends` pulls in every outram-park-backend crate, which is what
# gives the wheel the full simulation API rather than just `version()`.
manifest-path = "Cargo.toml"
# Mixed layout: the extension module lands inside a real Python package, so
# the generated `.pyi` stubs and `py.typed` ship with it and the API is
# discoverable without the Rust source.
python-source = "python"
module-name = "outram_park.outram_park"
