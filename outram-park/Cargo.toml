[package]
name = "outram-park"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
default-run = "outram-park"

# `outram-park` is the frontend crate for the outram-park-backend simulation
# engine. It serves three purposes:
#
# 1. A desktop GUI, gated behind the default `gui` feature.
# 2. An Android/Termux-compatible CLI and TUI, usable by humans and agents
#    alike, always available regardless of which optional features are on.
# 3. A `python` feature building this crate as a `cdylib` for `maturin`,
#    exposing the outram-park-backend API as a single Python wheel.
#
# Every outram-park-backend crate (see ../outram-park-backend/crates/) is
# also wired in below: one same-named optional dependency + feature each,
# and one re-export module each under src/backend/ (see src/backend/mod.rs).
# None of them build unless their feature is explicitly enabled.

[lib]
name = "outram_park"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "outram-park"
path = "src/main.rs"

[[bin]]
name = "fhr_sim"
path = "src/fhr_sim/main.rs"

[[bin]]
name = "ipwr_sim"
path = "src/ipwr_sim/main.rs"

[[bin]]
name = "bwr_sim"
path = "src/bwr_sim/main.rs"

[[bin]]
name = "htgr_sim"
path = "src/htgr_sim/main.rs"

[[bin]]
name = "gen_3_conventional_reactor_sim"
path = "src/gen_3_conventional_reactor_sim/main.rs"

[[bin]]
name = "fukushima_sim"
path = "src/fukushima_sim/main.rs"

[features]
default = ["gui"]
# Desktop GUI frontend (egui/eframe). Not available on Termux/Android; build
# with `--no-default-features` there to get the CLI/TUI only.
gui = ["dep:eframe", "dep:egui"]
# Build as a Python extension module (`cdylib`) for `maturin`, exposing the
# outram-park-backend API as a wheel. See ../outram-park/pyproject.toml.
python = ["dep:pyo3", "pyo3/extension-module"]

# One feature per outram-park-backend crate, each enabling only that crate's
# optional dependency (below) and its re-export module (src/backend/*.rs).
# Grouping mirrors outram-park-backend/Cargo.toml's own [workspace.members]
# comments.

# KOVAN toolchain (agent-facing tooling)
kovan = ["dep:kovan"]
kovan-codegen = ["dep:kovan-codegen"]
kovan-common = ["dep:kovan-common"]
kovan-discovery = ["dep:kovan-discovery"]
kovan-literature = ["dep:kovan-literature"]
kovan-metrics = ["dep:kovan-metrics"]
kovan-semantics = ["dep:kovan-semantics"]

# Core physics / coupling
bedok = ["dep:bedok"]
nee_soon = ["dep:nee_soon"]
tampines = ["dep:tampines"]
tampines-steam-tables = ["dep:tampines-steam-tables"]
teh-o-prke = ["dep:teh-o-prke"]
tuas_boussinesq_solver = ["dep:tuas_boussinesq_solver"]
boon-lay = ["dep:boon-lay"]
chem-eng-real-time-process-control-simulator = ["dep:chem-eng-real-time-process-control-simulator"]

# OpenFOAM-derived stack
outram-foam-basic-lib = ["dep:outram-foam-basic-lib"]
outram-foam-appbuilder-lib = ["dep:outram-foam-appbuilder-lib"]
outram-foam-mesh = ["dep:outram-foam-mesh"]
outram-foam-turbulence-lib = ["dep:outram-foam-turbulence-lib"]
outram-foam-multiphase = ["dep:outram-foam-multiphase"]
outram-foam-cli = ["dep:outram-foam-cli"]

# Meshing / visualization
outram-blender = ["dep:outram-blender"]
outram-park-digital-twin-engine = ["dep:outram-park-digital-twin-engine"]
outram-park-fork-cfmesh = ["dep:outram-park-fork-cfmesh"]

# Ported/forked external codes
outram-park-fork-coolprop = ["dep:outram-park-fork-coolprop"]
outram-park-fork-dwsim-libs = ["dep:outram-park-fork-dwsim-libs"]
outram-park-fork-liggghts = ["dep:outram-park-fork-liggghts"]
outram-park-fork-moltres = ["dep:outram-park-fork-moltres"]
outram-park-fork-offbeat = ["dep:outram-park-fork-offbeat"]
outram-park-fork-onix = ["dep:outram-park-fork-onix"]
outram-park-fork-pflotran = ["dep:outram-park-fork-pflotran"]
outram-park-fork-thermochimica = ["dep:outram-park-fork-thermochimica"]
njoy-outram-park-fork = ["dep:njoy-outram-park-fork"]
outram-mc-libs = ["dep:outram-mc-libs"]
outram-park-mpi = ["dep:outram-park-mpi"]

# Other
raffles = ["dep:raffles"]

[dependencies]
# CLI + TUI: always compiled in, pure-Rust and Termux/Android compatible.
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# GUI, optional (default feature).
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

# Python bindings, optional (maturin builds only).
pyo3 = { version = "0.22", optional = true }

# outram-park-backend crates, by path (in-tree, via the outram-park-backend
# git submodule) rather than a crates.io version — mirrors that repo's own
# "internal workspace crates" convention. All optional; each one is enabled
# only by its own same-named feature above.

# KOVAN toolchain
kovan = { path = "../outram-park-backend/crates/kovan", version = "0.0.0", optional = true }
kovan-codegen = { path = "../outram-park-backend/crates/kovan-codegen", version = "0.0.1", optional = true }
kovan-common = { path = "../outram-park-backend/crates/kovan-common", version = "0.0.1", optional = true }
kovan-discovery = { path = "../outram-park-backend/crates/kovan-discovery", version = "0.0.1", optional = true }
kovan-literature = { path = "../outram-park-backend/crates/kovan-literature", version = "0.0.1", optional = true }
kovan-metrics = { path = "../outram-park-backend/crates/kovan-metrics", version = "0.0.0", optional = true }
kovan-semantics = { path = "../outram-park-backend/crates/kovan-semantics", version = "0.0.1", optional = true }

# Core physics / coupling
bedok = { path = "../outram-park-backend/crates/bedok", version = "0.0.0", optional = true }
nee_soon = { path = "../outram-park-backend/crates/nee_soon", version = "0.0.2", optional = true }
tampines = { path = "../outram-park-backend/crates/tampines", version = "0.0.2", optional = true }
tampines-steam-tables = { path = "../outram-park-backend/crates/tampines-steam-tables", version = "0.2.7", optional = true }
teh-o-prke = { path = "../outram-park-backend/crates/teh-o-prke", version = "0.1.4", optional = true }
tuas_boussinesq_solver = { path = "../outram-park-backend/crates/tuas_boussinesq_solver", version = "0.1.6", optional = true }
boon-lay = { path = "../outram-park-backend/crates/boon-lay", version = "0.1.3", optional = true }
chem-eng-real-time-process-control-simulator = { path = "../outram-park-backend/crates/chem-eng-real-time-process-control-simulator", version = "0.2.1", optional = true }

# OpenFOAM-derived stack
outram-foam-basic-lib = { path = "../outram-park-backend/crates/outram-foam-basic-lib", version = "0.1.2", optional = true }
outram-foam-appbuilder-lib = { path = "../outram-park-backend/crates/outram-foam-appbuilder-lib", version = "0.1.2", optional = true }
outram-foam-mesh = { path = "../outram-park-backend/crates/outram-foam-mesh", version = "0.1.0", optional = true }
outram-foam-turbulence-lib = { path = "../outram-park-backend/crates/outram-foam-turbulence-lib", version = "0.1.2", optional = true }
outram-foam-multiphase = { path = "../outram-park-backend/crates/outram-foam-multiphase", version = "0.0.2", optional = true }
outram-foam-cli = { path = "../outram-park-backend/crates/outram-foam-cli", version = "0.1.0", optional = true }

# Meshing / visualization
outram-blender = { path = "../outram-park-backend/crates/outram-blender", version = "0.0.4", optional = true }
outram-park-digital-twin-engine = { path = "../outram-park-backend/crates/outram-park-digital-twin-engine", version = "0.0.2", optional = true }
outram-park-fork-cfmesh = { path = "../outram-park-backend/crates/outram-park-fork-cfmesh", version = "0.0.1", optional = true }

# Ported/forked external codes
outram-park-fork-coolprop = { path = "../outram-park-backend/crates/outram-park-fork-coolprop", version = "0.1.2", optional = true }
outram-park-fork-dwsim-libs = { path = "../outram-park-backend/crates/outram-park-fork-dwsim-libs", version = "0.0.3", optional = true }
outram-park-fork-liggghts = { path = "../outram-park-backend/crates/outram-park-fork-liggghts", version = "0.0.0", optional = true }
outram-park-fork-moltres = { path = "../outram-park-backend/crates/outram-park-fork-moltres", version = "0.0.0", optional = true }
outram-park-fork-offbeat = { path = "../outram-park-backend/crates/outram-park-fork-offbeat", version = "0.0.0", optional = true }
outram-park-fork-onix = { path = "../outram-park-backend/crates/outram-park-fork-onix", version = "0.0.0", optional = true }
outram-park-fork-pflotran = { path = "../outram-park-backend/crates/outram-park-fork-pflotran", version = "0.0.0", optional = true }
outram-park-fork-thermochimica = { path = "../outram-park-backend/crates/outram-park-fork-thermochimica", version = "0.0.0", optional = true }
njoy-outram-park-fork = { path = "../outram-park-backend/crates/njoy-outram-park-fork", version = "0.0.2", optional = true }
outram-mc-libs = { path = "../outram-park-backend/crates/outram-mc-libs", version = "0.0.3", optional = true }
outram-park-mpi = { path = "../outram-park-backend/crates/outram-park-mpi", version = "0.0.0", optional = true }

# Other
