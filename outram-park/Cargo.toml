[package]
name = "outram-park"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true
description = "OUTRAM PARK (Open-source Unified TRAnsient Multi-Physics Advanced Reactor simulation Kit; the M-P also reads Multi-Phase, its original name): one crate that pulls in every outram-park-backend crate behind a feature, plus a desktop GUI, a CLI and a TUI. For research, education and verification and validation only; not for reactor operation, licensing or safety decisions."
readme = "README.md"
default-run = "outram-park"
# The backend-wiring guard reads the outram-park-backend submodule, which the
# crates.io package does not contain.
exclude = ["tests/backend_wiring.rs"]

# `outram-park` is the frontend crate for the outram-park-backend simulation
# engine. It serves three purposes:
#
# 1. A desktop GUI, gated behind the default `gui` feature.
# 2. An Android/Termux-compatible CLI and TUI, usable by humans and agents
#    alike, always available regardless of which optional features are on.
# 3. A `python` feature building this crate as a `cdylib` for `maturin`,
#    exposing the outram-park-backend API as a single Python wheel.
#
# Every outram-park-backend crate (see ../outram-park-backend/crates/) is
# also wired in below: one same-named optional dependency + feature each,
# and one re-export module each under src/backend/ (see src/backend/mod.rs).
# None of them build unless their feature is explicitly enabled.

[lib]
name = "outram_park"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "outram-park"
path = "src/main.rs"

[[bin]]
name = "fhr_sim"
path = "src/fhr_sim/main.rs"

[[bin]]
name = "ipwr_sim"
path = "src/ipwr_sim/main.rs"

[[bin]]
name = "bwr_sim"
path = "src/bwr_sim/main.rs"

[[bin]]
name = "htgr_sim"
path = "src/htgr_sim/main.rs"

[[bin]]
name = "gen_3_conventional_reactor_sim"
path = "src/gen_3_conventional_reactor_sim/main.rs"

[[bin]]
name = "fukushima_sim"
path = "src/fukushima_sim/main.rs"

[features]
default = ["gui"]
# Desktop GUI frontend (egui/eframe). Not available on Termux/Android; build
# with `--no-default-features` there to get the CLI/TUI only.
gui = ["dep:eframe", "dep:egui"]
# Build as a Python extension module (`cdylib`) for `maturin`, exposing the
# outram-park-backend API as a wheel. See ../outram-park/pyproject.toml.
#
# `abi3-py39` builds against CPython's stable ABI, so one wheel covers
# CPython 3.9 and every later version -- including ones newer than the pyo3
# release it was built with. That matters here because the wheel is meant to
# be handed to whatever interpreter the recipient happens to have.
python = ["dep:pyo3", "pyo3/extension-module", "pyo3/abi3-py39", "dep:uom"]

# All backend crates at once -- what the Python wheel is built with, so the
# whole simulation API lands in the package. Kept as one feature so
# `pyproject.toml` and CI do not have to repeat the list.
all-backends = [
  "kovan", "kovan-codegen", "kovan-common", "kovan-discovery",
  "kovan-literature", "kovan-metrics", "kovan-semantics",
  "bedok", "nee_soon", "tampines", "tampines-steam-tables", "teh-o-prke",
  "tuas_boussinesq_solver", "boon-lay",
  "chem-eng-real-time-process-control-simulator",
  "outram-foam-basic-lib", "outram-foam-appbuilder-lib", "outram-foam-mesh",
  "outram-foam-turbulence-lib", "outram-foam-multiphase", "outram-foam-cli",
  "outram-blender", "outram-park-digital-twin-engine",
  "outram-park-fork-cfmesh", "outram-park-fork-coolprop",
  "outram-park-fork-dwsim-libs", "outram-park-fork-liggghts",
  "outram-park-fork-moltres", "outram-park-fork-offbeat",
  "outram-park-fork-onix", "outram-park-fork-pflotran",
  "outram-park-fork-thermochimica", "njoy-outram-park-fork",
  "outram-mc-libs", "outram-park-mpi", "raffles",
  "kovan-web", "petir", "farrer-park", "bishan", "buangkok", "changi",
  "sembawang", "redhill", "pasir-ris", "dhoby-ghaut", "dover", "kaki-bukit",
]

# One feature per outram-park-backend crate, each enabling only that crate's
# optional dependency (below) and its re-export module (src/backend/*.rs).
# Grouping mirrors outram-park-backend/Cargo.toml's own [workspace.members]
# comments.

# KOVAN toolchain (agent-facing tooling)
kovan = ["dep:kovan"]
kovan-codegen = ["dep:kovan-codegen"]
kovan-common = ["dep:kovan-common"]
kovan-discovery = ["dep:kovan-discovery"]
kovan-literature = ["dep:kovan-literature"]
kovan-metrics = ["dep:kovan-metrics"]
kovan-semantics = ["dep:kovan-semantics"]
kovan-web = ["dep:kovan-web"]

# Core physics / coupling
bedok = ["dep:bedok"]
nee_soon = ["dep:nee_soon"]
tampines = ["dep:tampines"]
tampines-steam-tables = ["dep:tampines-steam-tables"]
teh-o-prke = ["dep:teh-o-prke"]
tuas_boussinesq_solver = ["dep:tuas_boussinesq_solver"]
boon-lay = ["dep:boon-lay"]
chem-eng-real-time-process-control-simulator = ["dep:chem-eng-real-time-process-control-simulator"]

# OpenFOAM-derived stack
outram-foam-basic-lib = ["dep:outram-foam-basic-lib"]
outram-foam-appbuilder-lib = ["dep:outram-foam-appbuilder-lib"]
outram-foam-mesh = ["dep:outram-foam-mesh"]
outram-foam-turbulence-lib = ["dep:outram-foam-turbulence-lib"]
outram-foam-multiphase = ["dep:outram-foam-multiphase"]
outram-foam-cli = ["dep:outram-foam-cli"]

# Meshing / visualization
outram-blender = ["dep:outram-blender"]
outram-park-digital-twin-engine = ["dep:outram-park-digital-twin-engine"]
outram-park-fork-cfmesh = ["dep:outram-park-fork-cfmesh"]

# Ported/forked external codes
outram-park-fork-coolprop = ["dep:outram-park-fork-coolprop"]
outram-park-fork-dwsim-libs = ["dep:outram-park-fork-dwsim-libs"]
outram-park-fork-liggghts = ["dep:outram-park-fork-liggghts"]
outram-park-fork-moltres = ["dep:outram-park-fork-moltres"]
outram-park-fork-offbeat = ["dep:outram-park-fork-offbeat"]
outram-park-fork-onix = ["dep:outram-park-fork-onix"]
outram-park-fork-pflotran = ["dep:outram-park-fork-pflotran"]
outram-park-fork-thermochimica = ["dep:outram-park-fork-thermochimica"]
njoy-outram-park-fork = ["dep:njoy-outram-park-fork"]
outram-mc-libs = ["dep:outram-mc-libs"]
outram-park-mpi = ["dep:outram-park-mpi"]

# Other
raffles = ["dep:raffles"]

# Foundations
petir = ["dep:petir"]
farrer-park = ["dep:farrer-park"]

# Safety, source term and offsite consequences
bishan = ["dep:bishan"]
buangkok = ["dep:buangkok"]
changi = ["dep:changi"]
sembawang = ["dep:sembawang"]
redhill = ["dep:redhill"]
pasir-ris = ["dep:pasir-ris"]

# Applications and orchestration
dhoby-ghaut = ["dep:dhoby-ghaut"]
dover = ["dep:dover"]
kaki-bukit = ["dep:kaki-bukit"]

[dependencies]
# CLI + TUI: always compiled in, pure-Rust and Termux/Android compatible.
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# GUI, optional (default feature).
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

# Python bindings, optional (maturin builds only).
pyo3 = { version = "0.29", optional = true }
# Physical units. The backend expresses quantities with `uom`; the Python
# boundary converts them to plain `f64` in SI base units, which needs the
# same `uom` the backend crates use (0.38, per
# ../outram-park-backend/Cargo.toml).
uom = { version = "0.38", optional = true }

# outram-park-backend crates, ONLY as published crates.io versions — never a
# local path (maintainer, 2026-10-20). Backend and outram-park are published in
# lockstep: a backend release goes to crates.io first, then these pins move to
# it. All optional; each one is enabled only by its own same-named feature
# above.

# KOVAN toolchain
kovan = { package = "knowledge-oriented-vv-analysis-for-nuclear-sciences-kovan", version = "0.0.2", optional = true }
kovan-codegen = { version = "0.0.3", optional = true }
kovan-common = { version = "0.0.3", optional = true }
kovan-discovery = { version = "0.0.3", optional = true }
kovan-literature = { version = "0.0.2", optional = true }
kovan-metrics = { version = "0.0.2", optional = true }
kovan-semantics = { version = "0.0.2", optional = true }
kovan-web = { version = "0.0.2", optional = true }

# Core physics / coupling
bedok = { version = "0.0.1", optional = true }
nee_soon = { version = "0.0.4", optional = true }
tampines = { version = "0.0.3", optional = true }
tampines-steam-tables = { version = "0.3.0", optional = true }
teh-o-prke = { version = "0.1.7", optional = true }
tuas_boussinesq_solver = { version = "0.1.8", optional = true }
boon-lay = { version = "0.2.1", optional = true }
chem-eng-real-time-process-control-simulator = { version = "0.2.3", optional = true }

# OpenFOAM-derived stack
outram-foam-basic-lib = { version = "0.1.5", optional = true }
outram-foam-appbuilder-lib = { version = "0.1.5", optional = true }
outram-foam-mesh = { version = "0.1.1", optional = true }
outram-foam-turbulence-lib = { version = "0.1.3", optional = true }
outram-foam-multiphase = { version = "0.0.3", optional = true }
outram-foam-cli = { version = "0.0.1", optional = true }

# Meshing / visualization
outram-blender = { version = "0.0.6", optional = true }
outram-park-digital-twin-engine = { version = "0.0.3", optional = true }
outram-park-fork-cfmesh = { version = "0.0.3", optional = true }

# Ported/forked external codes
outram-park-fork-coolprop = { version = "0.1.3", optional = true }
outram-park-fork-dwsim-libs = { version = "0.0.4", optional = true }
outram-park-fork-liggghts = { version = "0.0.2", optional = true }
outram-park-fork-moltres = { version = "0.0.1", optional = true }
outram-park-fork-offbeat = { version = "0.0.1", optional = true }
outram-park-fork-onix = { version = "0.0.1", optional = true }
outram-park-fork-pflotran = { version = "0.0.1", optional = true }
outram-park-fork-thermochimica = { version = "0.0.1", optional = true }
njoy-outram-park-fork = { version = "0.0.5", optional = true }
outram-mc-libs = { version = "0.0.6", optional = true }
outram-park-mpi = { version = "0.0.1", optional = true }

# Other
raffles = { version = "0.0.2", optional = true }

# Foundations
petir = { version = "0.0.2", optional = true }
farrer-park = { version = "0.0.2", optional = true }

# Safety, source term and offsite consequences
bishan = { version = "0.0.1", optional = true }
buangkok = { version = "0.0.1", optional = true }
changi = { version = "0.0.1", optional = true }
sembawang = { version = "0.0.1", optional = true }
redhill = { version = "0.0.1", optional = true }
pasir-ris = { version = "0.0.1", optional = true }

# Applications and orchestration
dhoby-ghaut = { version = "0.0.1", optional = true }
dover = { package = "deck-based-open-source-visualisation-engine-for-reactors-dover", version = "0.0.1", optional = true }
kaki-bukit = { version = "0.0.1", optional = true }
